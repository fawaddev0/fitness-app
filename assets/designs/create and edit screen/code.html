<!-- Steppers Container: Reps & Sets in Side-by-Side Bento Grid -->
<div class="grid grid-cols-2 gap-3">
<!-- Reps Counter Card -->
<div class="bg-surface-container rounded-lg p-3.5 flex flex-col justify-between shadow-sm">
<div class="flex items-center justify-between mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Target Reps</span>
<span class="material-symbols-outlined text-primary-container text-[18px]">repeat</span>
</div>
<div class="flex items-center justify-center my-1">
<span class="font-display-hero-mobile text-display-hero-mobile font-bold text-on-surface tracking-tighter" id="repsCount">12</span>
</div>
<div class="flex items-center justify-between gap-2 mt-2 bg-surface-container-low rounded-full p-1">
<button class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center active:scale-90 transition-transform" onclick="adjustStepper('repsCount', -1, 1, 99)" type="button">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<button class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center active:scale-90 transition-transform" onclick="adjustStepper('repsCount', 1, 1, 99)" type="button">

</button>

<span class="text-error">Delete Exercise</span>
</button>

<script>
  // Stepper Controller
  function adjustStepper(id, delta, min, max) {
    const el = document.getElementById(id);
    if (!el) return;
    let val = parseInt(el.textContent, 10) || 0;
    val = Math.max(min, Math.min(max, val + delta));
    el.textContent = val;
  }

  // Rest Timer Controller
  let restSeconds = 60;
  function adjustRest(delta) {
    restSeconds = Math.max(15, Math.min(300, restSeconds + delta));
    const restEl = document.getElementById('restDuration');
    if (restEl) {
      restEl.textContent = restSeconds + 's';
    }
  }

  // Dropdown Drawer Logic
  const selectBtn = document.getElementById('exerciseSelectBtn');
  const dropdown = document.getElementById('exerciseDropdown');
  const chevron = document.getElementById('exerciseChevron');

  if (selectBtn && dropdown && chevron) {
    selectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = dropdown.classList.contains('hidden');
      if (isHidden) {
        dropdown.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        dropdown.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    });

    document.addEventListener('click', () => {
      dropdown.classList.add('hidden');
      chevron.classList.remove('rotate-180');
    });
  }

  function selectExercise(name, category, altPrompt) {
    const nameEl = document.getElementById('selectedExerciseName');
    const catEl = document.getElementById('selectedExerciseCategory');
    const thumbEl = document.getElementById('selectedExerciseThumb');
    if (nameEl) nameEl.textContent = name;
    if (catEl) catEl.textContent = category;
    if (thumbEl && altPrompt) {
      thumbEl.setAttribute('data-alt', altPrompt);
    }
    if (dropdown) dropdown.classList.add('hidden');
    if (chevron) chevron.classList.remove('rotate-180');
  }

  // Character counter for notes field
  const notesArea = document.getElementById('exerciseNotes');
  const charCounter = document.getElementById('charCount');
  if (notesArea && charCounter) {
    notesArea.addEventListener('input', (e) => {
      const count = e.target.value.length;
      charCounter.textContent = count + ' / 140';
      if (count > 140) {
        charCounter.classList.add('text-error');
      } else {
        charCounter.classList.remove('text-error');
      }
    });
  }

  // Save Confirmation Micro-Interaction
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const originalHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = `<span class="material-symbols-outlined text-[22px] animate-spin">refresh</span><span>Optimizing Model...</span>`;
      saveBtn.classList.add('opacity-90');
      setTimeout(() => {
        saveBtn.innerHTML = `<span class="material-symbols-outlined text-[22px]">check</span><span>Saved & Compiled!</span>`;
        saveBtn.classList.remove('opacity-90');
        setTimeout(() => {
          saveBtn.innerHTML = originalHtml;
        }, 1800);
      }, 700);
    });
  }
</script></main>
